name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Offline assignment CLI
        run: python scrape.py --url "https://www.eventim.de/event/holiday-on-ice-mirage-merkur-ostseehalle-20995028/" --html test/fixtures/holiday_on_ice.html --output offline-result.json
      - run: python start.py --check
      - name: POSIX launcher
        if: runner.os != 'Windows'
        run: sh START_HERE.sh --help
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: START_HERE.bat --help
